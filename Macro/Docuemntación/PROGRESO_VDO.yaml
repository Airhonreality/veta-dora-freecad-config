  modelo: "100% generativo por código (sin .FCStd estáticos)"
  capa_global: "Params_Melamina (parametros_globales: espesor_default, canto_grueso, ranura_fondo)"
  capa_local: "Params (dimensiones del módulo: alto, ancho, fondo, espesor)"
  capa_atomica: vdo_panel_melamina_base (ladrillo geométrico paramétrico)
  nucleo:
    - vdo_manifest.py
    - vdo_guardian.py
  interfaz: Mod/VDO_Workbench (barra "VDO - Muebles Paramétricos" generada desde vdo_manifest)
  convencion_parametros: alto / ancho / fondo / espesor (unificada)
  legacy: _archivo/ (plantillas .FCStd deprecadas, conservadas por trazabilidad)

