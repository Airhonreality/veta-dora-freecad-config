# =====================================================================
# PROGRESO_VDO.yaml
# Registro de progreso del sistema paramétrico Veta de Oro (VDO).
# Cada entrada se añade bajo `registro:` (la más reciente al final).
# =====================================================================

proyecto: Veta de Oro (VDO)
raiz_biblioteca: biblioteca_veta_dorada
unidades: mm
version_manifest_actual: 1.1.0
estado_global: Sistema 100% generativo + Interfaz VDO - Muebles Paramétricos operativa

# ---------------------------------------------------------------------
# Fase actual
# ---------------------------------------------------------------------
fase_actual:
  nombre: Decisión 3 - Interfaz VDO - Muebles Paramétricos (Workbench genérico)
  estado: completado
  fecha_cierre: 2026-09-18
  validado_en: FreeCAD 1.1.3 (flatpak org.freecad.FreeCAD, freecadcmd)

# ---------------------------------------------------------------------
# Arquitectura en vigor
# ---------------------------------------------------------------------
