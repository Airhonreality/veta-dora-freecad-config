    area: Toolbar persistente sin workbench (Task 5)
    descripcion: >
      El workbench no aparecía en el selector. En lugar de seguir depurando el
      registro Python de workbenches, se adoptó un enfoque radicalmente más simple:
      FreeCAD almacena TODA la configuración de toolbars en user.cfg (XML).
      Se reverse-engineered el formato y se creó vdo_toolbar_inject.py que inyecta
      directamente las definiciones de macros y la toolbar en user.cfg, sin
      workbench, sin Gui.addCommand, sin InitGui.py. El toolbar "CARPINTERIA - VDO"
      aparece en Global/Toolbar/ (visible en todos los workbenches) tras reiniciar.
    archivos_creados:
      - "Macro/vdo_toolbar_inject.py (inyecta XML en ~/.config/FreeCAD/v1-1/user.cfg)"
      - "TOOLBAR_SOLUTION.md (documentación del enfoque XML)"
    decisiones:
      - "D4: usar configuración XML de user.cfg en lugar de workbench Python; el formato es el mismo que FreeCAD usa al personalizar toolbars manualmente, lo que garantiza 100% de compatibilidad y confiabilidad"
    detalles:
      - Macro definitions en BaseApp/Macro/Macros/Std_Macro_N/
      - Toolbar definition en BaseApp/Workbench/Global/Toolbar/Custom_1/
      - Visibility flag en BaseApp/MainWindow/Toolbars/
      - Cada FCText en Custom_1: Name=comando_id, Value="FreeCAD"
      - Backup automático de user.cfg con timestamp
    validacion: 4 macros definidas + toolbar CARPINTERIA - VDO con 4 botones inyectada y visible

  - fecha: 2026-10-10
    checkpoint: Refactor axiomático - Separación Semántica/Física
    area: Motor de paneles agnóstico + diccionario semántico (Task 6)
    descripcion: >
      Se detectó un fallo axiomático: el motor de paneles acoplaba la semántica
      de mobiliario (estandar/fachada) a reglas físicas (cantos, holguras, tipo
      de fachada) y a la orientación, que en realidad es libre e independiente.
      Se adoptó el Axioma 5 de Separación Semántica/Física: el motor modela solo
      piezas físicas (orientación, cantos, material, espesor); la semántica de
      mobiliario vivirá en un diccionario semántico (datos puros) que hoy no
      existe, por lo que hoy no se acopla nada.
    decisiones:
      - "A1: orientacion es un atributo fisico libre (vocabulario del manifiesto), no una regla de subtipo"
      - "A2: 'fachada' = canto rigido x4 + material 'fachadas' es un mapeo del futuro diccionario, no una rama del motor"
      - "A3: 'division' = panel orientado verticalmente; las divisiones del COCO deben ser piezas VDO exportables"
    archivos_modificados:
      - vdo_panel_core.py (motor agnostico: validacion orientacion + mapeo de ejes + VDO_Orientacion)
      - vdo_manifest.json (vocabulario orientaciones)
      - vdo_defaults.py (ORIENTACIONES_VALIDAS / mapeo de ejes)
      - vdo_panel_estandar.FCMacro / vdo_panel_fachada.FCMacro (contrato agnostico)
      - vdo_coco_core.py / vdo_coco_spaces.py (divisiones al despiece)
      - vdo_export_cutting_list.py (extraccion consciente de orientacion)
    archivos_creados:
      - vdo_panel_division.FCMacro
      - vdo_diccionario_semantico.md (esqueleto de la tabla de piezas)
    detalles:
      - orientacion obligatoria (horizontal/vertical); ValueError si falta o es invalida
      - horizontal: Length=ancho, Width=fondo, Height=espesor (normal Z)
      - vertical: Length=espesor, Width=fondo, Height=alto (normal X, division/lateral)
      - Placement queda libre (identidad) para que el mueble/espacio posicione la pieza
      - se elimino la rama if tipo == fachada que inyectaba holguras/tipo-fachada
      - VDO_Subtipo deja de dirigir geometria; solo tag libre (VDO_Etiqueta)
    validacion: pendiente prueba en FreeCAD GUI + self-tests de despiece

  - fecha: 2026-10-20
    checkpoint: Estabilización anidación divisiones COCO (Task 7)
    area: Motor de espacios libres vdo_coco_spaces.py / vdo_spaces.py
    descripcion: >
      Se corrigieron los dos principales bugs del sistema de divisiones anidadas:
      DT-1: Posición de divisores verticales (creaban en inicio de vano, no en hueco entre vanos).
      DT-2: Recursión de sub-espacios anidados sin validar (propagación de regiones X↔Y).
      Ahora los divisores se crean EN LOS HUECOS entre vanos consecutivos (i > 0 → divider en espacios[i-1]["fin"]).
      Los hijos de nodos IGUALES (partes iguales) se procesan en MISMO eje (flatten).
      Solo sub-divisiones explícitas del usuario (FIJO/RESTANTE con children) alternan eje X↔Y.
      Validado con tests standalone: módulo 1000mm, fijo 400 + iguales 2 → 3 verticales en 400 y 700.
      Anidación X→Y (columna con repisas) y Y→X (banda con verticales) confirmada.
    decisiones:
      - "D5: divisores = huecos entre vanos, no uno por vano; i=0 no crea divisor"
      - "D6: IGUALES children = mismo eje (son vanos hermanos); solo user children alternan eje"
      - "D7: tracking de región unificado: X→Y pasa ancho_repisa=libre, Y→X pasa altura_divisor=libre"
    archivos_modificados:
      - vdo_coco_spaces.py (_generar_shapes_recursivo reescrito, nuevas _crear_division_*_en)
      - DEUDA_TECNICA_VDO.md (DT-1, DT-2 marcados como resueltos)
    validacion: tests standalone passing (ver sesión 2026-10-20)

