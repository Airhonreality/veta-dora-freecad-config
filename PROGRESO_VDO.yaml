# =====================================================================
# PROGRESO_VDO.yaml
# Log de desarrollo e hitos del sistema VDO - Veta de Oro
# =====================================================================

proyecto: "VDO - Motor Paramétrico de Muebles de Melamina"
version_actual: "1.8.0"
fecha_actualización: "2026-09-21"

# =====================================================================
# SESIÓN 2026-09-21 - MÓDULO CAJÓN CON CORREDERA OCULTA (v1.8.0)
# =====================================================================

sesion_2026_09_21_cajon_oculta:
  duración: "~2 horas"
  participantes: ["Usuario (desarrollo carpintería)", "Claude (arquitectura)"]

  objetivo: "Nuevo módulo paramétrico: despiece de cajón con correderas ocultas (Blum Tandem, Hafele, Ducasse, genéricas) con precisión milimétrica"

  decisiones_clave:
    - "Entradas: LI/ProfInt directos (interior libre) + AnchoModulo/AltoFrente para fachada"
    - "Alcance 3D: solo madera (5 piezas de caja + fachada) con mecanizados modelados; raíles = datos del manifest"
    - "Fórmulas puras separadas en vdo_cajon_despiece.py (sin FreeCAD, self-test con python3)"
    - "Constantes de herraje (Delta, longitudes, cotas de mecanizado) centralizadas en vdo_manifest.json"
    - "Montaje de trasera configurable: entre_laterales (default) | testa"

  fórmulas_implementadas:
    guia: "LG = max(longitudes_comerciales ≤ ProfInt), override manual"
    ancho_caja: "LI − Delta (Blum Tandem 16mm → 49 mm)"
    laterales: "Largo = LG, Alto = AltoCaja (85/120/150), G = 15/16"
    contra_frente: "Ancho = ancho_caja − 2·G (entre laterales); Alto = AltoCaja − (eje_ranura + Gfondo)"
    piso: "Ancho = ancho_contra + 2·penetración (8-10/lado); Largo = LG"
    fachada: "Ancho = AnchoModulo − 2·holg_lat; Alto = AltoFrente − holg_sup − holg_inf"
    mecanizados: "Ranura inferior (eje 11.5, ancho=Gfondo), taladros Ø6 desde inferior, notch inferior en contra-frente"

  archivos_creados:
    - "Macro/vdo_cajon_despiece.py (fórmulas puras + self-test)"
    - "Macro/vdo_cajon_core.py (FeaturePython CajonFeature + make_cajon)"
    - "Macro/vdo_cajon_task.py (CajonTaskPanel PySide)"
    - "Macro/vdo_cajon_oculta.FCMacro (envoltorio)"
    - "Macro/vdo_cajon.svg (icono)"

  archivos_modificados:
    - "Macro/vdo_manifest.json (v1.8.0: correderas_ocultas, parametros_cajon, espesores melamina 6/12/15/16, herrajes corredera)"
    - "schemas/vdo_manifest_schema.json (tipado de correderas_ocultas y parametros_cajon)"
    - "Macro/vdo_defaults.py (constantes CAJON_*_DEFAULT)"
    - "Macro/vdo_export_cutting_list.py (fix: usar pieza.espesor, no material[0] — multi-espesor)"
    - "Macro/vdo_toolbar_inject.py (Std_Macro_4 → vdo_cajon_oculta.FCMacro)"

  validacion:
    - "python3 Macro/vdo_cajon_despiece.py → ✅ self-test (LI=600, Prof=580 → LG=550, ancho_ext=551, contra=519, piso=539)"
    - "jsonschema sobre manifest actualizado"
    - "Smoke test freecadcmd: make_cajon → 6 piezas + VDO_Paneles_JSON"

  contrato_export:
    VDO_Tipo: "contenedor"
    VDO_Subtipo: "cajon_oculta"
    VDO_Herraje_Ref: "blum_tandem | generica | hafele | ducasse"
    VDO_Paneles_JSON: "6 piezas (2 laterales, contra-frente, frente interior, piso, fachada) con mecanizados por pieza"

# =====================================================================
# SESIÓN 2026-09-21 - JSON SCHEMA + EXPORT CUTTING LIST
# =====================================================================

sesion_2026_09_21:
  duración: "~6 horas"
  participantes: ["Usuario (desarrollo carpintería)", "Claude (arquitectura)"]

  decisiones_clave:
    - "JSON Schema desde inicio (no refactorizar después)"
    - "Loader centralizado para resolver tipos sin hardcode"
    - "Validación de compatibilidades integrada"

  tareas_completadas:

    1_análisis_arquitectónico:
      descripción: "Diagnóstico profundo de VDO"
      archivo: "DIAGNOSTICO_ARQUITECTURA_VDO.md"
      hallazgos:
        - "Separación de concerns: Buena"
        - "Guardian pattern: Excelente"
        - "Schema: Informal (Python dict)"
      conclusión: "Necesita formalización para escala"

    2_investigación_librerías:
      librerías_evaluadas:
        - "Pydantic v2 - Tipado + validación"
        - "SymPy - Expresiones paramétricas"
        - "CadQuery - DSL CAD"
        - "jsonschema - Validación JSON Schema"
      conclusión: "jsonschema es solución óptima (mínima + poderosa)"

    3_vdo_manifest_json:
      archivo: "Macro/vdo_manifest.json"
      descripción: "Catálogo centralizado JSON"
      secciones:
        - "materiales: melamina, roble RH, MDF"
        - "herrajes: bisagras, tiradores (con compatibilidades)"
        - "procesos: corte, acanalar, perforación, cepillado"
        - "parámetros_globales y parámetros_locales"
      características:
        - "Tipado con min/max values"
        - "Compatibilidades explícitas"
        - "Costos centralizados"
      líneas: 120

    4_vdo_manifest_schema_json:
      archivo: "schemas/vdo_manifest_schema.json"
      descripción: "JSON Schema (validación)"
      características:
        - "Valida tipos, restricciones, propiedades requeridas"
        - "Documentación inline"
        - "Compatible con cualquier herramienta JSON Schema"
      líneas: 100

    5_vdo_loader_py:
      archivo: "Macro/vdo_loader.py"
      descripción: "Cargador centralizado"
      responsabilidades:
        - "Cargar vdo_manifest.json"
        - "Validar contra vdo_manifest_schema.json"
        - "Proporcionar acceso tipado a datos"
      métodos_clave:
        - "get_material(id) → dict con especificación"
        - "get_hardware(id) → dict con especificación"
        - "validar_compatibilidad(material, hardware) → bool"
        - "calcular_costo_material(material, area_m2) → float"
      líneas: 150

    4_vdo_export_cutting_list_py:
      archivo: "Macro/vdo_export_cutting_list.py"
      descripción: "Exportador a CSV sin hardcode"
      flujo:
        - "Extrae piezas del documento FreeCAD"
        - "Lee propiedades: VDO_Material_Ref, VDO_Hardware, etc"
        - "Consulta loader para especificaciones (sin hardcode)"
        - "Calcula costos dinámicamente"
        - "Genera CSV compatible con OpenCutList"
      ejemplo_material_string: "{espesor}mm_{referencia}_{tipo}"
      líneas: 180

# =====================================================================
# ARQUITECTURA FINAL
